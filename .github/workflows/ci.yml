name: C++ and RTL CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ verilator \
            libssl-dev libpq-dev libboost-dev libboost-system-dev \
            nlohmann-json3-dev
      - name: Configure
        run: cmake -S hardware -B hardware/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build hardware/build --parallel 2
      - name: Test
        run: ctest --test-dir hardware/build --output-on-failure
